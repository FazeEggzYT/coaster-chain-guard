plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Optional: jars dropped in libs/ are available to compile against.
    // compileOnly keeps them out of the built jar.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

// ---------------------------------------------------------------------------
// The two mod description files are written by the build itself, so the jar
// always contains them regardless of how src/main/resources is laid out.
// ---------------------------------------------------------------------------
def modIdValue = mod_id
def modNameValue = mod_name
def modVersionValue = mod_version
def modLicenseValue = mod_license
def modAuthorsValue = mod_authors
def modDescriptionValue = mod_description
def minecraftVersionValue = minecraft_version
def neoVersionValue = neo_version
def createRangeValue = create_version_range
def coastersRangeValue = coasters_version_range

def generatedResources = layout.buildDirectory.dir('generated/modresources')

tasks.register('generateModFiles') {
    def outDir = generatedResources.get().asFile
    outputs.dir(outDir)
    inputs.property('modId', modIdValue)
    inputs.property('modVersion', modVersionValue)
    inputs.property('neoVersion', neoVersionValue)

    doLast {
        def metaInf = new File(outDir, 'META-INF')
        metaInf.mkdirs()

        new File(metaInf, 'neoforge.mods.toml').text = """\
modLoader = "javafml"
loaderVersion = "[4,)"
license = "${modLicenseValue}"

[[mods]]
modId = "${modIdValue}"
version = "${modVersionValue}"
displayName = "${modNameValue}"
authors = "${modAuthorsValue}"
description = '''${modDescriptionValue}'''

[[mixins]]
config = "${modIdValue}.mixins.json"

[[dependencies.${modIdValue}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoVersionValue},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modIdValue}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersionValue}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modIdValue}]]
modId = "create"
type = "required"
versionRange = "${createRangeValue}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modIdValue}]]
modId = "simulatedcoasters"
type = "required"
versionRange = "${coastersRangeValue}"
ordering = "AFTER"
side = "BOTH"
"""

        new File(outDir, "${modIdValue}.mixins.json").text = """\
{
  "required": true,
  "minVersion": "0.8",
  "package": "com.example.coasterchainguard.mixin",
  "compatibilityLevel": "JAVA_21",
  "mixins": [
    "CartLinkTensionMixin"
  ],
  "injectors": {
    "defaultRequire": 1
  }
}
"""
    }
}

sourceSets.main.resources.srcDir(generatedResources)

tasks.named('processResources') {
    dependsOn 'generateModFiles'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
